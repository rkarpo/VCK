<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einsatzplanung VCK 2026</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 12px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }

        .btn {
            background-color: #2b5797;
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover { background-color: #1e3d6b; }

        .btn-back {
            background-color: #6c757d;
            margin-bottom: 15px;
        }

        .btn-add {
            background-color: #f0f4f9;
            color: #2b5797;
            border: 1px dashed #2b5797;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: all 0.2s;
        }

        .btn-add:hover {
            background-color: #e2ebf8;
        }

        .btn-del {
            background: #f8d7da;
            border: none;
            color: #842029;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .table-container {
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 13px;
        }

        th, td {
            border: 1px solid #e0e0e0;
            padding: 8px;
        }

        th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #495057;
        }

        .header-title {
            font-size: 16px;
            font-weight: bold;
            color: #2b5797;
        }

        /* Formular Controls Desktop */
        td input, td select {
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
            font-size: 13px;
            color: #333;
            padding: 6px;
        }

        td select { text-align-last: center; }

        .status-ok {
            background-color: #d1e7dd !important;
            color: #0f5132;
            font-weight: bold;
        }

        .status-fehlen {
            background-color: #f8d7da !important;
            color: #842029;
            font-weight: bold;
        }

        /* ===================================================
           MOBIL-DESIGNS (Karten-Ansicht für Smartphones)
           =================================================== */
        @media (max-width: 768px) {
            body { padding: 6px; }
            .container { padding: 12px; border-radius: 8px; }

            /* Tabelle in Blocks auflösen */
            table, thead, tbody, tfoot, th, td, tr {
                display: block;
            }

            /* Kopfzeile der Desktop-Tabelle ausblenden */
            thead tr {
                position: absolute;
                top: -9999px;
                left: -9999px;
            }

            /* Jede Person als eigene Karte */
            tbody tr:not(#addRowContainer) {
                background: #ffffff;
                border: 1px solid #dcdcdc;
                border-radius: 10px;
                padding: 12px;
                margin-bottom: 16px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            }

            tbody td {
                border: none;
                padding: 6px 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
                text-align: right;
            }

            /* Name & Rolle ganz oben hervorheben */
            tbody td:nth-child(1),
            tbody td:nth-child(2) {
                display: block;
                padding: 4px 0;
            }

            tbody td:nth-child(1) input {
                font-size: 16px;
                font-weight: bold;
                border-color: #2b5797;
                padding: 8px;
            }

            tbody td:nth-child(2) select {
                padding: 8px;
                font-weight: 500;
            }

            /* Schicht-Label per CSS-Attribut data-label einblenden */
            tbody td[data-label]::before {
                content: attr(data-label);
                font-weight: 600;
                font-size: 12px;
                color: #555;
                text-align: left;
                padding-right: 10px;
                flex: 1;
            }

            tbody td select.select-shift {
                width: 140px;
                padding: 8px;
            }

            .col-action {
                margin-top: 10px;
                border-top: 1px solid #eee;
                padding-top: 10px !important;
                display: flex;
                justify-content: flex-end;
            }

            .btn-del {
                width: 100%;
                text-align: center;
            }

            /* Zusammenfassung (Footer) Mobil styling */
            tfoot {
                margin-top: 25px;
                background: #f8f9fa;
                border-radius: 10px;
                padding: 12px;
                border: 1px solid #e0e0e0;
            }

            tfoot tr {
                display: flex;
                flex-wrap: wrap;
                margin-bottom: 10px;
                border-bottom: 1px solid #ddd;
                padding-bottom: 8px;
            }

            tfoot tr:last-child {
                border-bottom: none;
                margin-bottom: 0;
            }

            .calc-row-title {
                width: 100%;
                text-align: left;
                font-weight: bold;
                margin-bottom: 6px;
                color: #2b5797;
            }

            tfoot td[id] {
                flex: 1 0 30%;
                font-size: 11px;
                padding: 4px;
                margin: 2px;
                border-radius: 4px;
                border: 1px solid #ddd;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="btn btn-back">← Zurück zur Startseite</a>

        <div class="table-container">
            <table id="planTable">
                <thead>
                    <tr>
                        <th colspan="2" class="header-title">Einsatzplan VCK</th>
                        <th>18.09. Fr<br><small>Aufbau (10:00)</small></th>
                        <th>19.09. Sa 1<br><small>16:00-20:30</small></th>
                        <th>19.09. Sa 2<br><small>20:30-01:00</small></th>
                        <th>20.09. So 1<br><small>11:00-16:00</small></th>
                        <th>20.09. So 2<br><small>16:00-21:00</small></th>
                        <th>20.09. So<br><small>Abbau (21:00)</small></th>
                        <th style="width:40px;"></th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr id="addRowContainer">
                        <td colspan="9" style="border:none; padding: 10px 0;">
                            <button class="btn-add" onclick="window.addNewPerson()">+ Person hinzufügen</button>
                        </td>
                    </tr>
                </tbody>

                <tfoot>
                    <tr>
                        <td colspan="2" class="calc-row-title">Benötigt</td>
                        <td id="req-0">6</td>
                        <td id="req-1">7</td>
                        <td id="req-2">8</td>
                        <td id="req-3">6</td>
                        <td id="req-4">7</td>
                        <td id="req-5">6</td>
                        <td class="col-action"></td>
                    </tr>
                    <tr>
                        <td colspan="2" class="calc-row-title">Gesamt eingeteilt</td>
                        <td id="total-0">0</td>
                        <td id="total-1">0</td>
                        <td id="total-2">0</td>
                        <td id="total-3">0</td>
                        <td id="total-4">0</td>
                        <td id="total-5">0</td>
                        <td class="col-action"></td>
                    </tr>
                    <tr>
                        <td colspan="2" class="calc-row-title">Status</td>
                        <td id="status-0">--</td>
                        <td id="status-1">--</td>
                        <td id="status-2">--</td>
                        <td id="status-3">--</td>
                        <td id="status-4">--</td>
                        <td id="status-5">--</td>
                        <td class="col-action"></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7UmrLGoePSvE1H0nZMUFjXY6HvWSynq4",
            authDomain: "vckuppenheim.firebaseapp.com",
            databaseURL: "https://vckuppenheim-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "vckuppenheim",
            storageBucket: "vckuppenheim.firebasestorage.app",
            messagingSenderId: "83870233719",
            appId: "1:83870233719:web:c0d012932ca73990208272",
            measurementId: "G-J2PTXVD404"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const planRef = ref(database, 'vck_einsatzplan_2026');

        const roleOptions = ["Freizeit", "Damen 1", "Damen 2", "Jugend", "Trainer/Vorstand"];
        const shiftLabels = [
            "Fr 18.09. Aufbau",
            "Sa 19.09. Schicht 1",
            "Sa 19.09. Schicht 2",
            "So 20.09. Schicht 1",
            "So 20.09. Schicht 2",
            "So 20.09. Abbau"
        ];

        window.addNewPerson = function() {
            const newPerson = {
                name: "",
                role: "Freizeit",
                shifts: ["", "", "", "", "", ""]
            };
            push(planRef, newPerson);
        };

        window.updateRow = function(key) {
            const tr = document.querySelector(`tr[data-key="${key}"]`);
            if (!tr) return;

            const nameInput = tr.querySelector('.input-name');
            const roleSelect = tr.querySelector('.select-role');
            const shiftSelects = tr.querySelectorAll('.select-shift');

            const name = nameInput.value;
            const role = roleSelect.value;
            const shifts = Array.from(shiftSelects).map(select => select.value);

            set(ref(database, `vck_einsatzplan_2026/${key}`), {
                name: name,
                role: role,
                shifts: shifts
            });
        };

        window.deleteRow = function(key) {
            if (confirm("Möchtest du diese Person wirklich löschen?")) {
                remove(ref(database, `vck_einsatzplan_2026/${key}`));
            }
        };

        onValue(planRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                renderTable(data);
            }
        });

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            const addRowContainer = document.getElementById('addRowContainer');

            const existingRows = tbody.querySelectorAll('tr:not(#addRowContainer)');
            existingRows.forEach(row => row.remove());

            Object.keys(data).forEach(key => {
                const person = data[key];
                const tr = document.createElement('tr');
                tr.dataset.key = key;

                const roleOptionsHtml = roleOptions.map(r => 
                    `<option value="${r}" ${person.role === r ? 'selected' : ''}>${r}</option>`
                ).join('');

                const shiftsHtml = (person.shifts || ["","","","","",""]).map((s, col) => {
                    let extraOption = "";
                    if (col === 0) extraOption = `<option value="Aufbau" ${s === 'Aufbau' ? 'selected' : ''}>Aufbau</option>`;
                    if (col === 5) extraOption = `<option value="Abbau" ${s === 'Abbau' ? 'selected' : ''}>Abbau</option>`;

                    return `
                        <td data-label="${shiftLabels[col]}">
                            <select class="select-shift" data-col="${col}" onchange="window.updateRow('${key}'); window.calculateTotals();">
                                <option value="" ${!s ? 'selected' : ''}>---</option>
                                <option value="verfügbar" ${s === 'verfügbar' ? 'selected' : ''}>verfügbar</option>
                                ${extraOption}
                            </select>
                        </td>
                    `;
                }).join('');

                tr.innerHTML = `
                    <td><input type="text" class="input-name" value="${person.name || ''}" placeholder="Name der Person" onchange="window.updateRow('${key}')"></td>
                    <td>
                        <select class="select-role" onchange="window.updateRow('${key}')">
                            ${roleOptionsHtml}
                        </select>
                    </td>
                    ${shiftsHtml}
                    <td class="col-action"><button class="btn-del" onclick="window.deleteRow('${key}')">Person entfernen</button></td>
                `;

                tbody.insertBefore(tr, addRowContainer);
            });

            calculateTotals();
        }

        window.calculateTotals = function() {
            const numCols = 6;
            const requiredCount = [6, 7, 8, 6, 7, 6];

            for (let col = 0; col < numCols; col++) {
                const selects = document.querySelectorAll(`.select-shift[data-col="${col}"]`);
                let count = 0;

                selects.forEach(select => {
                    if (select.value.trim() !== '') {
                        count++;
                    }
                });

                document.getElementById(`total-${col}`).innerText = count;

                const statusCell = document.getElementById(`status-${col}`);
                const needed = requiredCount[col];

                if (count >= needed) {
                    statusCell.innerText = "OK";
                    statusCell.className = "status-ok";
                } else {
                    statusCell.innerText = "Fehlen";
                    statusCell.className = "status-fehlen";
                }
            }
        };
    </script>
</body>
</html>
