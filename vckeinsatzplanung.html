<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC7UmrLGoePSvE1H0nZMUFjXY6HvWSynq4",
        authDomain: "vckuppenheim.firebaseapp.com",
        databaseURL: "https://vckuppenheim-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "vckuppenheim",
        storageBucket: "vckuppenheim.firebasestorage.app",
        messagingSenderId: "83870233719",
        appId: "1:83870233719:web:c0d012932ca73990208272",
        measurementId: "G-J2PTXVD404"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const planRef = ref(database, 'vck_einsatzplan_2026');

    // Zeile direkt mit Firebase-Push-ID anlegen
    window.addNewPerson = function() {
        const newPerson = {
            name: "",
            role: "",
            shifts: ["", "", "", "", "", ""]
        };
        // push() gibt eine Referenz inklusive der neuen eindeutigen ID zurück
        push(planRef, newPerson);
    };

    window.updateRow = function(key) {
        const tr = document.querySelector(`tr[data-key="${key}"]`);
        if (!tr) return;

        const inputs = tr.querySelectorAll('input');
        const name = inputs[0].value;
        const role = inputs[1].value;
        const shifts = [];

        for (let i = 2; i < inputs.length; i++) {
            shifts.push(inputs[i].value);
        }

        // Pfad explizit angeben zum Speichern
        set(ref(database, `vck_einsatzplan_2026/${key}`), {
            name: name,
            role: role,
            shifts: shifts
        }).catch((error) => {
            console.error("Fehler beim Speichern:", error);
        });
    };

    window.deleteRow = function(key) {
        if (confirm("Möchtest du diese Person wirklich aus der Planung entfernen?")) {
            remove(ref(database, `vck_einsatzplan_2026/${key}`));
        }
    };

    const initialData = [
        { name: "Frank", role: "Freizeit", shifts: ["Aufbau", "verfügbar", "verfügbar", "", "", "Abbau"] },
        { name: "Marco", role: "Freizeit", shifts: ["Aufbau", "verfügbar", "verfügbar", "", "", ""] },
        { name: "Alex", role: "Freizeit", shifts: ["Aufbau", "verfügbar", "verfügbar", "", "", "Abbau"] },
        { name: "Jochen", role: "Freizeit", shifts: ["Aufbau", "verfügbar", "", "", "", "Abbau"] },
        { name: "Eddie", role: "Freizeit", shifts: ["Aufbau", "verfügbar", "", "verfügbar", "", "Abbau"] },
        { name: "Jan", role: "Trainer/Freizeit", shifts: ["Aufbau", "verfügbar", "verfügbar", "verfügbar", "verfügbar", "Abbau"] },
        { name: "Chris", role: "Freizeit", shifts: ["", "", "verfügbar", "", "", ""] },
        { name: "Ines", role: "Freizeit", shifts: ["", "", "", "verfügbar", "", ""] },
        { name: "Anna", role: "Freizeit", shifts: ["", "", "", "verfügbar", "", ""] },
        { name: "Markus", role: "Trainer/Freizeit", shifts: ["", "", "", "", "verfügbar", "Abbau"] },
        { name: "Katja", role: "Damen 1", shifts: ["", "", "", "", "verfügbar", ""] },
        { name: "Jessie", role: "Damen 1", shifts: ["", "", "verfügbar", "", "", ""] },
        { name: "Micha", role: "Trainer/Freizeit", shifts: ["", "", "", "", "verfügbar", ""] },
        { name: "Michael", role: "Trainer/Freizeit", shifts: ["", "", "", "", "", ""] }
    ];

    onValue(planRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) {
            initialData.forEach(item => push(planRef, item));
        } else {
            renderTable(data);
        }
    });

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        const addRowContainer = document.getElementById('addRowContainer');
        
        // Aktiven Fokus sichern, damit die Tastatur beim Schreiben auf Mobilgeräten nicht zugeht
        const activeInput = document.activeElement;
        const activeKey = activeInput ? activeInput.closest('tr')?.dataset?.key : null;
        const activeIndex = activeInput ? Array.from(activeInput.closest('tr')?.querySelectorAll('input') || []).indexOf(activeInput) : -1;

        const existingRows = tbody.querySelectorAll('tr:not(#addRowContainer)');
        existingRows.forEach(row => row.remove());

        Object.keys(data).forEach(key => {
            const person = data[key];
            const tr = document.createElement('tr');
            tr.dataset.key = key;

            const shiftsHtml = (person.shifts || ["","","","","",""]).map((s, col) => 
                `<td><input type="text" class="shift-input" data-col="${col}" value="${s || ''}" onchange="updateRow('${key}')" oninput="calculateTotals()"></td>`
            ).join('');

            tr.innerHTML = `
                <td><input type="text" value="${person.name || ''}" placeholder="Name" onchange="updateRow('${key}')"></td>
                <td><input type="text" value="${person.role || ''}" placeholder="Gruppe/Rolle" onchange="updateRow('${key}')"></td>
                ${shiftsHtml}
                <td class="col-action"><button class="btn-del" onclick="deleteRow('${key}')" title="Zeile entfernen">×</button></td>
            `;

            tbody.insertBefore(tr, addRowContainer);
        });

        // Fokus nach dem Rendern wiederherstellen
        if (activeKey && activeIndex !== -1) {
            const row = document.querySelector(`tr[data-key="${activeKey}"]`);
            if (row) {
                const input = row.querySelectorAll('input')[activeIndex];
                if (input) input.focus();
            }
        }

        calculateTotals();
    }

    function calculateTotals() {
        const numCols = 6;
        const requiredCount = [6, 7, 8, 6, 7, 6];

        for (let col = 0; col < numCols; col++) {
            const inputs = document.querySelectorAll(`.shift-input[data-col="${col}"]`);
            let count = 0;

            inputs.forEach(input => {
                if (input.value.trim() !== '') {
                    count++;
                }
            });

            document.getElementById(`total-${col}`).innerText = count;

            const statusCell = document.getElementById(`status-${col}`);
            const needed = requiredCount[col];

            if (count >= needed) {
                statusCell.innerText = "okay";
                statusCell.className = "status-ok";
            } else {
                statusCell.innerText = "Leute fehlen";
                statusCell.className = "status-fehlen";
            }
        }
    }
</script>
