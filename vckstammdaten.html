<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verpflegungs- & Detailplanung | VC Kuppenheim</title>
    <style>
        :root {
            --primary-red: #d00000;
            --primary-red-hover: #9e0000;
            --gold-accent: #d4af37;
            --gold-hover: #f3ce5a;
            --bg-color: #f8f9fa;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #111111;
            --text-muted: #555555;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: 
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><g fill="none" stroke="%23d00000" stroke-width="1.2" opacity="0.12"><circle cx="50" cy="50" r="42"/><path d="M 50,8 C 25,25 25,75 50,92"/><path d="M 50,8 C 75,25 75,75 50,92"/><path d="M 8,50 C 25,25 75,25 92,50"/><path d="M 8,50 C 25,75 75,75 92,50"/><path d="M 20,20 C 35,45 65,45 80,20" stroke-dasharray="2,1"/><path d="M 20,80 C 35,55 65,55 80,80" stroke-dasharray="2,1"/></g></svg>'),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><g fill="none" stroke="%23111111" stroke-width="1.2" opacity="0.08"><circle cx="50" cy="50" r="42"/><path d="M 8,50 C 25,25 75,25 92,50"/><path d="M 8,50 C 25,75 75,75 92,50"/><path d="M 20,20 C 45,35 45,65 20,80" stroke-dasharray="2,1"/><path d="M 80,20 C 55,35 55,65 80,80" stroke-dasharray="2,1"/></g></svg>');
            background-repeat: no-repeat, no-repeat;
            background-size: 180px 180px, 240px 240px;
            background-position: 5% 8%, 92% 40%;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
            border: 2px solid var(--gold-accent);
            position: relative;
        }

        /* Unauffälliger Drag & Drop Toggle ganz oben rechts */
        .drag-toggle-wrapper {
            position: absolute;
            top: 14px;
            right: 18px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.72rem;
            color: #888;
            user-select: none;
            opacity: 0.6;
            transition: opacity 0.2s ease;
        }

        .drag-toggle-wrapper:hover {
            opacity: 1;
        }

        .drag-toggle-wrapper input[type="checkbox"] {
            cursor: pointer;
            accent-color: var(--primary-red);
        }

        .logo-container {
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
        }

        .logo-container img {
            max-width: 90px;
            height: auto;
            mix-blend-mode: multiply;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 4px;
            text-align: center;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 18px;
            text-align: center;
        }

        /* Haupt-Tabs */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 18px;
            background: rgba(0, 0, 0, 0.05);
            padding: 4px;
            border-radius: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 8px;
            font-size: 0.85rem;
            font-weight: 700;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: #ffffff;
            color: var(--primary-red);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            border: 1px solid var(--gold-accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Eingabeformulare */
        .add-form {
            background: #fff;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid #e0e0e0;
            margin-bottom: 18px;
        }

        .add-form h3 {
            font-size: 0.95rem;
            margin-bottom: 10px;
            color: var(--text-dark);
        }

        .input-group {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="text"], input[type="number"], select {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            background-color: #fff;
        }

        /* Direkt editierbare Tabellen-Inputs */
        .table-input {
            width: 100%;
            border: 1px solid transparent;
            background: transparent;
            padding: 4px 6px;
            border-radius: 4px;
        }

        .table-input:hover, .table-input:focus {
            border-color: var(--gold-accent);
            background: #fff;
        }

        .btn {
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: linear-gradient(180deg, var(--primary-red) 0%, #b00000 100%);
            color: #ffffff;
            border: 1.5px solid var(--gold-accent);
        }

        .btn:hover {
            background: linear-gradient(180deg, #e60000 0%, var(--primary-red-hover) 100%);
        }

        .btn-small {
            padding: 6px 10px;
            font-size: 0.78rem;
        }

        .btn-icon {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            padding: 3px 6px;
            border-radius: 4px;
            color: #666;
            transition: background 0.15s ease;
        }
        .btn-icon:hover {
            background: #eee;
            color: #111;
        }

        .sub-group-title {
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--primary-red);
            margin: 16px 0 8px 0;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 2px solid var(--gold-accent);
            padding-bottom: 4px;
        }

        /* Karten & Drag and Drop Styles */
        .item-card {
            background: #ffffff;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid #e0e0e0;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .item-card[draggable="true"] {
            cursor: grab;
        }
        .item-card[draggable="true"]:active {
            cursor: grabbing;
        }
        .item-card.dragging {
            opacity: 0.4;
            border: 2px dashed var(--gold-accent);
        }

        .drag-handle {
            display: inline-block;
            color: #aaa;
            margin-right: 6px;
            cursor: grab;
            font-size: 0.9rem;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: #fdfdfd;
            cursor: pointer;
            user-select: none;
        }

        .item-header:hover {
            background: #f5f5f5;
        }

        .item-header .title-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.98rem;
            flex-wrap: wrap;
        }

        .item-header .count-badge {
            font-size: 0.73rem;
            font-weight: normal;
            background: #eef2f5;
            padding: 3px 8px;
            border-radius: 10px;
            color: var(--text-muted);
            border: 1px solid #dcdcdc;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        /* Roter Badge, falls noch keine Daten angelegt wurden */
        .item-header .count-badge.empty-badge {
            background-color: #ffe6e6;
            border-color: #ffb3b3;
            color: #b30000;
            font-weight: 600;
        }

        .item-header-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .title-edit-form {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .item-body {
            display: none;
            padding: 14px;
            border-top: 1px solid #eee;
            background: #fafafa;
        }

        .item-card.open .item-body {
            display: block;
        }

        .item-card.open .chevron {
            transform: rotate(180deg);
        }

        .chevron {
            transition: transform 0.2s ease;
            font-size: 0.8rem;
            color: #888;
            margin-left: 6px;
        }

        /* Tabellen */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
            font-size: 0.85rem;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e5e5e5;
        }

        .data-table th {
            background: #f0f0f0;
            text-align: left;
            padding: 6px 10px;
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
        }

        .data-table td {
            padding: 4px 6px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        .btn-back {
            background: #ffffff;
            color: var(--text-dark);
            border: 2px solid #ccc;
            margin-top: 20px;
            display: block;
            text-decoration: none;
            text-align: center;
        }
        .btn-back:hover { background: #f0f0f0; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Kleine Drag & Drop Checkbox oben rechts -->
        <label class="drag-toggle-wrapper">
            <input type="checkbox" id="enableDragToggle" onchange="toggleDragAndDrop()">
            <span>Drag & Drop</span>
        </label>

        <div class="logo-container">
            <img src="logo.jpg" alt="VC Kuppenheim Logo">
        </div>

        <h1>Rezept- & Materialplanung</h1>
        <p class="subtitle">Zutaten, Verbrauchsgegenstände & Ausrüstung verwalten</p>

        <!-- Haupt-Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('getraenke')">🍹 Getränke</button>
            <button class="tab-btn" onclick="switchTab('verpflegung')">🍕 Verpflegung</button>
            <button class="tab-btn" onclick="switchTab('orga')">📦 Orga & Material</button>
        </div>

        <!-- REITER 1: GETRÄNKE -->
        <div id="tab-getraenke" class="tab-content active">
            <div class="add-form">
                <h3>Neues Getränk anlegen</h3>
                <div class="input-group">
                    <input type="text" id="newDrinkName" placeholder="z.B. Aperol Spritz" style="flex:2;">
                    <select id="newDrinkType" style="flex:1;">
                        <option value="alkoholisch">🍹 Alkoholisch</option>
                        <option value="alkoholfrei">🥤 Alkoholfrei</option>
                    </select>
                    <button class="btn btn-small" onclick="addItem('getraenke')">Anlegen</button>
                </div>
            </div>

            <div class="sub-group-title">🍹 Alkoholische Getränke</div>
            <div id="list-getraenke-alkoholisch" class="drag-container">Lade Daten...</div>

            <div class="sub-group-title">🥤 Alkoholfreie Getränke</div>
            <div id="list-getraenke-alkoholfrei" class="drag-container">Lade Daten...</div>
        </div>

        <!-- REITER 2: VERPFLEGUNG -->
        <div id="tab-verpflegung" class="tab-content">
            <div class="add-form">
                <h3>Neues Gericht / Speise anlegen</h3>
                <div class="input-group">
                    <input type="text" id="newFoodName" placeholder="z.B. Wurst im Weck" style="flex:1;">
                    <button class="btn btn-small" onclick="addItem('verpflegung')">Anlegen</button>
                </div>
            </div>
            <div id="list-verpflegung" class="drag-container">Lade Daten...</div>
        </div>

        <!-- REITER 3: ORGA / MATERIAL -->
        <div id="tab-orga" class="tab-content">
            <div class="add-form">
                <h3>Neuen Orga-Punkt anlegen</h3>
                <div class="input-group">
                    <input type="text" id="newOrgaName" placeholder="z.B. Kassenbereich / Bar-Equipment" style="flex:1;">
                    <button class="btn btn-small" onclick="addItem('orga')">Anlegen</button>
                </div>
            </div>
            <div id="list-orga" class="drag-container">Lade Daten...</div>
        </div>

        <a href="admin.html" class="btn btn-back">← Zurück zum Admin-Bereich</a>
    </div>

    <!-- Firebase SDKs & Anwendungscode -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, set, push, remove, update, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7UmrLGoePSvE1H0nZMUFjXY6HvWSynq4",
            authDomain: "vckuppenheim.firebaseapp.com",
            databaseURL: "https://vckuppenheim-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "vckuppenheim",
            storageBucket: "vckuppenheim.firebasestorage.app",
            messagingSenderId: "83870233719",
            appId: "1:83870233719:web:1ff3c18818c1dda1208272",
            measurementId: "G-CFWMCQSYVM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let dataStore = { getraenke: {}, verpflegung: {}, orga: {} };
        let openCards = new Set();
        let editingTitleKey = null;
        let isDragEnabled = false;

        // Toggle für Drag & Drop (wird von der Checkbox aufgerufen)
        window.toggleDragAndDrop = function() {
            const checkbox = document.getElementById('enableDragToggle');
            isDragEnabled = checkbox ? checkbox.checked : false;
            render();
        };

        // Live-Daten aus Firebase abrufen
        const stammdatenRef = ref(db, 'stammdaten');
        onValue(stammdatenRef, (snapshot) => {
            const data = snapshot.val() || {};
            dataStore = {
                getraenke: data.getraenke || {},
                verpflegung: data.verpflegung || {},
                orga: data.orga || {}
            };
            render();
        });

        // Tab-Umschaltung
        window.switchTab = function(cat) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`tab-${cat}`).classList.add('active');
        };

        // Auf- / Zuklappen
        window.toggleCard = function(key) {
            if (openCards.has(key)) {
                openCards.delete(key);
            } else {
                openCards.add(key);
            }
            render();
        };

        // Haupt-Eintrag anlegen
        window.addItem = function(category) {
            const now = Date.now();
            if (category === 'getraenke') {
                const name = document.getElementById('newDrinkName').value.trim();
                const drinkType = document.getElementById('newDrinkType').value;
                if (!name) return alert("Bitte Namen eingeben!");

                const newRef = push(ref(db, `stammdaten/getraenke`));
                set(newRef, { name: name, type: drinkType, order: now, ingredients: {}, consumables: {}, equipment: {} });
                document.getElementById('newDrinkName').value = "";
            } else {
                const inputId = category === 'verpflegung' ? 'newFoodName' : 'newOrgaName';
                const name = document.getElementById(inputId).value.trim();
                if (!name) return alert("Bitte Namen eingeben!");

                const newRef = push(ref(db, `stammdaten/${category}`));
                set(newRef, { name: name, order: now, ingredients: {}, consumables: {}, equipment: {} });
                document.getElementById(inputId).value = "";
            }
        };

        // Namen eines Eintrags bearbeiten / speichern
        window.startEditTitle = function(key) {
            editingTitleKey = key;
            render();
        };

        window.saveItemTitle = function(category, key) {
            const input = document.getElementById(`edit-title-input-${key}`);
            if (input) {
                const newName = input.value.trim();
                if (newName) {
                    // Update in Firebase
                    update(ref(db, `stammdaten/${category}/${key}`), { name: newName });
                }
            }
            // Edit-Modus direkt nach dem Speichern beenden
            editingTitleKey = null;
            render();
        };

        window.cancelEditTitle = function() {
            editingTitleKey = null;
            render();
        };

        window.deleteItem = function(category, key) {
            if (confirm("Diesen Eintrag samt Zutaten, Verbrauchsgegenständen & Ausrüstung wirklich löschen?")) {
                remove(ref(db, `stammdaten/${category}/${key}`));
            }
        };

        // SUB-ITEMS (Zutaten & Verbrauchsgegenstände)
        window.addListSubItem = function(category, itemKey, subType) {
            const name = document.getElementById(`${subType}-name-${itemKey}`).value.trim();
            const amount = document.getElementById(`${subType}-amount-${itemKey}`).value.trim();
            const unit = document.getElementById(`${subType}-unit-${itemKey}`).value;

            if (!name) return alert("Bitte Name eingeben!");

            const newRef = push(ref(db, `stammdaten/${category}/${itemKey}/${subType}`));
            set(newRef, { name, amount: amount || "1", unit });

            document.getElementById(`${subType}-name-${itemKey}`).value = "";
            document.getElementById(`${subType}-amount-${itemKey}`).value = "";
        };

        window.updateListSubItem = function(category, itemKey, subType, subKey, field, value) {
            update(ref(db, `stammdaten/${category}/${itemKey}/${subType}/${subKey}`), {
                [field]: value
            });
        };

        window.removeListSubItem = function(category, itemKey, subType, subKey) {
            remove(ref(db, `stammdaten/${category}/${itemKey}/${subType}/${subKey}`));
        };

        // AUSRÜSTUNG
        window.addEquipment = function(category, itemKey) {
            const input = document.getElementById(`eq-input-${itemKey}`);
            const name = input.value.trim();
            if (!name) return alert("Bitte Name der Ausrüstung eingeben!");

            const newEqRef = push(ref(db, `stammdaten/${category}/${itemKey}/equipment`));
            set(newEqRef, { name });
            input.value = "";
        };

        window.updateEquipment = function(category, itemKey, eqKey, value) {
            update(ref(db, `stammdaten/${category}/${itemKey}/equipment/${eqKey}`), {
                name: value
            });
        };

        window.removeEquipment = function(category, itemKey, eqKey) {
            remove(ref(db, `stammdaten/${category}/${itemKey}/equipment/${eqKey}`));
        };

        // Hilfsfunktion zur Erstellung von Mengentabellen
        function renderQuantityTable(category, itemKey, subType, subObj) {
            const keys = Object.keys(subObj || {});
            if (keys.length === 0) return `<p style="font-size:0.8rem; color:#999; margin-bottom:8px;">Noch keine Einträge vorhanden.</p>`;

            let rows = "";
            keys.forEach(subKey => {
                const item = subObj[subKey];
                rows += `
                    <tr>
                        <td>
                            <input type="text" class="table-input" value="${item.name || ''}" 
                                   onblur="updateListSubItem('${category}', '${itemKey}', '${subType}', '${subKey}', 'name', this.value)">
                        </td>
                        <td style="width: 105px;">
                            <input type="number" step="any" class="table-input" value="${item.amount || ''}" 
                                   onblur="updateListSubItem('${category}', '${itemKey}', '${subType}', '${subKey}', 'amount', this.value)">
                        </td>
                        <td style="width: 110px;">
                            <select class="table-input" onchange="updateListSubItem('${category}', '${itemKey}', '${subType}', '${subKey}', 'unit', this.value)">
                                ${['Stück','cl','dl','l','g','kg','Zweige','Scheibe','Flasche','Dose','Packung','Rolle'].map(u => 
                                    `<option value="${u}" ${item.unit === u ? 'selected' : ''}>${u}</option>`
                                ).join('')}
                            </select>
                        </td>
                        <td style="text-align:right; width: 40px;">
                            <button class="btn-icon" onclick="removeListSubItem('${category}', '${itemKey}', '${subType}', '${subKey}')" title="Löschen">❌</button>
                        </td>
                    </tr>
                `;
            });

            return `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Bezeichnung</th>
                            <th>Menge</th>
                            <th>Einheit</th>
                            <th style="text-align:right;"></th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        // Card HTML Render
        function renderCardHTML(category, key, item) {
            const isOpen = openCards.has(key);
            const isEditingTitle = (editingTitleKey === key);

            const ingredientsObj = item.ingredients || {};
            const consumablesObj = item.consumables || {};
            const equipmentObj = item.equipment || {};

            const ingKeys = Object.keys(ingredientsObj);
            const conKeys = Object.keys(consumablesObj);
            const eqKeys = Object.keys(equipmentObj);

            // Prüfen ob gänzlich noch keine Einträge angelegt wurden
            const totalItemsCount = ingKeys.length + conKeys.length + eqKeys.length;
            const isEmpty = (totalItemsCount === 0);

            // AUSRÜSTUNG TABELLE
            let equipmentRowsHtml = "";
            eqKeys.forEach(eqKey => {
                const eq = equipmentObj[eqKey];
                equipmentRowsHtml += `
                    <tr>
                        <td>
                            <input type="text" class="table-input" value="${eq.name || ''}" 
                                   onblur="updateEquipment('${category}', '${key}', '${eqKey}', this.value)">
                        </td>
                        <td style="text-align:right; width: 40px;">
                            <button class="btn-icon" onclick="removeEquipment('${category}', '${key}', '${eqKey}')" title="Löschen">❌</button>
                        </td>
                    </tr>
                `;
            });

            // Titel-Bereich oder Inline-Edit-Formular
            let titleAreaHtml = "";
            if (isEditingTitle) {
                titleAreaHtml = `
                    <div class="title-edit-form" onclick="event.stopPropagation();">
                        <input type="text" id="edit-title-input-${key}" value="${item.name}" style="padding:4px 8px; font-size:0.9rem;" autofocus>
                        <button class="btn btn-small" onclick="saveItemTitle('${category}', '${key}')">Speichern</button>
                        <button class="btn-icon" onclick="cancelEditTitle()">✖</button>
                    </div>
                `;
            } else {
                titleAreaHtml = `
                    ${isDragEnabled ? '<span class="drag-handle">::</span>' : ''}
                    <span>${item.name}</span>
                    <span class="count-badge ${isEmpty ? 'empty-badge' : ''}">
                        ${ingKeys.length} Zutaten | ${conKeys.length} Verbrauchsartikel | ${eqKeys.length} Ausrüstung
                    </span>
                `;
            }

            // Draggable Attribut nur bei aktivierter Checkbox vergeben
            const draggableAttr = isDragEnabled ? 'draggable="true"' : '';

            return `
                <div class="item-card ${isOpen ? 'open' : ''}" data-key="${key}" data-category="${category}" ${draggableAttr}>
                    <div class="item-header" onclick="toggleCard('${key}')">
                        <div class="title-area">
                            ${titleAreaHtml}
                        </div>
                        <div class="item-header-actions">
                            ${!isEditingTitle ? `
                                <button class="btn-icon" onclick="event.stopPropagation(); startEditTitle('${key}')" title="Name bearbeiten">✏️</button>
                            ` : ''}
                            <button class="btn-icon" onclick="event.stopPropagation(); deleteItem('${category}', '${key}')" title="Löschen">🗑️</button>
                            <span class="chevron">▼</span>
                        </div>
                    </div>
                    <div class="item-body">
                        
                        <!-- ABSCHNITT 1: ZUTATEN -->
                        <h5 style="font-size:0.8rem; text-transform:uppercase; color:#666; margin-bottom:6px;">1. Zutaten & Mengen</h5>
                        ${renderQuantityTable(category, key, 'ingredients', ingredientsObj)}

                        <div class="input-group" style="margin-bottom:18px;">
                            <input type="text" id="ingredients-name-${key}" placeholder="Neue Zutat (z.B. Gin, Wurst)" style="flex:2;">
                            <input type="number" step="any" id="ingredients-amount-${key}" placeholder="Menge" style="width:90px;">
                            <select id="ingredients-unit-${key}">
                                <option value="cl">cl</option>
                                <option value="dl">dl</option>
                                <option value="l">l</option>
                                <option value="g">g</option>
                                <option value="kg">kg</option>
                                <option value="Stück">Stück</option>
                                <option value="Zweige">Zweige</option>
                                <option value="Scheibe">Scheibe</option>
                                <option value="Flasche">Flasche</option>
                                <option value="Dose">Dose</option>
                                <option value="Packung">Packung</option>
                            </select>
                            <button class="btn btn-small" onclick="addListSubItem('${category}', '${key}', 'ingredients')">+ Hinzufügen</button>
                        </div>

                        <!-- ABSCHNITT 2: VERBRAUCHSGEGENSTÄNDE -->
                        <h5 style="font-size:0.8rem; text-transform:uppercase; color:#666; margin-bottom:6px;">2. Verbrauchsgegenstände & Mengen</h5>
                        ${renderQuantityTable(category, key, 'consumables', consumablesObj)}

                        <div class="input-group" style="margin-bottom:18px;">
                            <input type="text" id="consumables-name-${key}" placeholder="Neuer Verbrauchsartikel (z.B. Pommesschalen, Strohhalme)" style="flex:2;">
                            <input type="number" step="any" id="consumables-amount-${key}" placeholder="Menge" style="width:90px;">
                            <select id="consumables-unit-${key}">
                                <option value="Stück">Stück</option>
                                <option value="Packung">Packung</option>
                                <option value="Rolle">Rolle</option>
                                <option value="Dose">Dose</option>
                            </select>
                            <button class="btn btn-small" onclick="addListSubItem('${category}', '${key}', 'consumables')">+ Hinzufügen</button>
                        </div>

                        <!-- ABSCHNITT 3: AUSRÜSTUNG -->
                        <h5 style="font-size:0.8rem; text-transform:uppercase; color:#666; margin-bottom:6px;">3. Ausrüstung</h5>
                        ${eqKeys.length > 0 ? `
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Gegenstand / Gerät</th>
                                        <th style="text-align:right;"></th>
                                    </tr>
                                </thead>
                                <tbody>${equipmentRowsHtml}</tbody>
                            </table>
                        ` : '<p style="font-size:0.8rem; color:#999; margin-bottom:8px;">Noch keine Ausrüstung angelegt.</p>'}

                        <div class="input-group">
                            <input type="text" id="eq-input-${key}" placeholder="Neue Ausrüstung (z.B. Fritteuse, Gläser, Mixer)" style="flex:1;">
                            <button class="btn btn-small" onclick="addEquipment('${category}', '${key}')">+ Hinzufügen</button>
                        </div>

                    </div>
                </div>
            `;
        }

        // DRAG AND DROP HANDLER (Nur wenn isDragEnabled wahr ist)
        function initDragAndDrop() {
            if (!isDragEnabled) return;

            const containers = document.querySelectorAll('.drag-container');

            containers.forEach(container => {
                let draggedItem = null;

                container.addEventListener('dragstart', (e) => {
                    if (!isDragEnabled) return;
                    const card = e.target.closest('.item-card');
                    if (!card) return;
                    draggedItem = card;
                    card.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                });

                container.addEventListener('dragend', (e) => {
                    if (!isDragEnabled) return;
                    const card = e.target.closest('.item-card');
                    if (card) card.classList.remove('dragging');
                    
                    // Neue Sortierung in Firebase speichern
                    saveOrder(container);
                });

                container.addEventListener('dragover', (e) => {
                    if (!isDragEnabled) return;
                    e.preventDefault();
                    const afterElement = getDragAfterElement(container, e.clientY);
                    if (!draggedItem) return;
                    
                    if (afterElement == null) {
                        container.appendChild(draggedItem);
                    } else {
                        container.insertBefore(draggedItem, afterElement);
                    }
                });
            });
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.item-card:not(.dragging)')];

            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        // Reihenfolge-Reindexierung in Firebase
        function saveOrder(container) {
            const cards = container.querySelectorAll('.item-card');
            cards.forEach((card, index) => {
                const key = card.dataset.key;
                const category = card.dataset.category;
                if (key && category) {
                    update(ref(db, `stammdaten/${category}/${key}`), { order: index });
                }
            });
        }

        // Sortierhilfe für Daten
        function sortItemsByOrder(itemsObj) {
            return Object.keys(itemsObj).map(key => ({
                key,
                ...itemsObj[key]
            })).sort((a, b) => (a.order || 0) - (b.order || 0));
        }

        // Haupt-Render-Funktion
        function render() {
            // 1. Getränke
            const alkContainer = document.getElementById('list-getraenke-alkoholisch');
            const freikContainer = document.getElementById('list-getraenke-alkoholfrei');
            alkContainer.innerHTML = "";
            freikContainer.innerHTML = "";

            const sortedDrinks = sortItemsByOrder(dataStore.getraenke);
            let alkCount = 0, freiCount = 0;

            sortedDrinks.forEach(item => {
                const html = renderCardHTML('getraenke', item.key, item);
                if (item.type === 'alkoholfrei') {
                    freikContainer.innerHTML += html;
                    freiCount++;
                } else {
                    alkContainer.innerHTML += html;
                    alkCount++;
                }
            });

            if (alkCount === 0) alkContainer.innerHTML = "<p style='font-size:0.8rem; color:#999;'>Keine alkoholischen Getränke vorhanden.</p>";
            if (freiCount === 0) freikContainer.innerHTML = "<p style='font-size:0.8rem; color:#999;'>Keine alkoholfreien Getränke vorhanden.</p>";

            // 2. Verpflegung
            const foodContainer = document.getElementById('list-verpflegung');
            foodContainer.innerHTML = "";
            const sortedFoods = sortItemsByOrder(dataStore.verpflegung);
            if (sortedFoods.length === 0) {
                foodContainer.innerHTML = "<p style='font-size:0.8rem; color:#999;'>Keine Speisen vorhanden.</p>";
            } else {
                sortedFoods.forEach(item => {
                    foodContainer.innerHTML += renderCardHTML('verpflegung', item.key, item);
                });
            }

            // 3. Orga & Material
            const orgaContainer = document.getElementById('list-orga');
            orgaContainer.innerHTML = "";
            const sortedOrgas = sortItemsByOrder(dataStore.orga);
            if (sortedOrgas.length === 0) {
                orgaContainer.innerHTML = "<p style='font-size:0.8rem; color:#999;'>Keine Orga-Punkte vorhanden.</p>";
            } else {
                sortedOrgas.forEach(item => {
                    orgaContainer.innerHTML += renderCardHTML('orga', item.key, item);
                });
            }

            // Drag & Drop neu initialisieren
            initDragAndDrop();
        }
    </script>
</body>
</html>
