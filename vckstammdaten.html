<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verpflegungs- & Detailplanung | VC Kuppenheim</title>
    <style>
        :root {
            --primary-red: #d00000;
            --primary-red-hover: #9e0000;
            --gold-accent: #d4af37;
            --gold-hover: #f3ce5a;
            --bg-color: #f8f9fa;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #111111;
            --text-muted: #555555;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: 
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><g fill="none" stroke="%23d00000" stroke-width="1.2" opacity="0.12"><circle cx="50" cy="50" r="42"/><path d="M 50,8 C 25,25 25,75 50,92"/><path d="M 50,8 C 75,25 75,75 50,92"/><path d="M 8,50 C 25,25 75,25 92,50"/><path d="M 8,50 C 25,75 75,75 92,50"/><path d="M 20,20 C 35,45 65,45 80,20" stroke-dasharray="2,1"/><path d="M 20,80 C 35,55 65,55 80,80" stroke-dasharray="2,1"/></g></svg>'),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><g fill="none" stroke="%23111111" stroke-width="1.2" opacity="0.08"><circle cx="50" cy="50" r="42"/><path d="M 8,50 C 25,25 75,25 92,50"/><path d="M 8,50 C 25,75 75,75 92,50"/><path d="M 20,20 C 45,35 45,65 20,80" stroke-dasharray="2,1"/><path d="M 80,20 C 55,35 55,65 80,80" stroke-dasharray="2,1"/></g></svg>');
            background-repeat: no-repeat, no-repeat;
            background-size: 180px 180px, 240px 240px;
            background-position: 5% 8%, 92% 40%;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
            border: 2px solid var(--gold-accent);
        }

        .logo-container {
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
        }

        .logo-container img {
            max-width: 90px;
            height: auto;
            mix-blend-mode: multiply;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 4px;
            text-align: center;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 18px;
            text-align: center;
        }

        /* Haupt-Tabs */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 18px;
            background: rgba(0, 0, 0, 0.05);
            padding: 4px;
            border-radius: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 8px;
            font-size: 0.85rem;
            font-weight: 700;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: #ffffff;
            color: var(--primary-red);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            border: 1px solid var(--gold-accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Eingabeformulare */
        .add-form {
            background: #fff;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid #e0e0e0;
            margin-bottom: 18px;
        }

        .add-form h3 {
            font-size: 0.95rem;
            margin-bottom: 10px;
            color: var(--text-dark);
        }

        .input-group {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="text"], input[type="number"], select {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            background-color: #fff;
        }

        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            border-color: var(--gold-accent);
        }

        .btn {
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: linear-gradient(180deg, var(--primary-red) 0%, #b00000 100%);
            color: #ffffff;
            border: 1.5px solid var(--gold-accent);
        }

        .btn:hover {
            background: linear-gradient(180deg, #e60000 0%, var(--primary-red-hover) 100%);
        }

        .btn-small {
            padding: 6px 10px;
            font-size: 0.78rem;
        }

        .btn-icon {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            padding: 2px 5px;
            border-radius: 4px;
        }
        .btn-icon:hover {
            background: #eee;
        }

        /* Unterteilungen (z.B. Alkoholisch / Alkoholfrei) */
        .sub-group-title {
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--primary-red);
            margin: 16px 0 8px 0;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 2px solid var(--gold-accent);
            padding-bottom: 4px;
        }

        /* Akkordeon & Karten */
        .item-card {
            background: #ffffff;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid #e0e0e0;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: #fdfdfd;
            cursor: pointer;
            user-select: none;
        }

        .item-header:hover {
            background: #f5f5f5;
        }

        .item-header .title-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 0.98rem;
        }

        .item-header .count-badge {
            font-size: 0.75rem;
            font-weight: normal;
            background: #eee;
            padding: 2px 8px;
            border-radius: 10px;
            color: var(--text-muted);
        }

        .item-body {
            display: none;
            padding: 14px;
            border-top: 1px solid #eee;
            background: #fafafa;
        }

        .item-card.open .item-body {
            display: block;
        }

        .item-card.open .chevron {
            transform: rotate(180deg);
        }

        .chevron {
            transition: transform 0.2s ease;
            font-size: 0.8rem;
            color: #888;
        }

        /* Tabellen für Zutaten */
        .ingredient-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
            font-size: 0.85rem;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e5e5e5;
        }

        .ingredient-table th {
            background: #f0f0f0;
            text-align: left;
            padding: 6px 10px;
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
        }

        .ingredient-table td {
            padding: 6px 10px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        .edit-row-inputs {
            display: flex;
            gap: 4px;
        }

        .tag-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }

        .tag {
            background: #fff;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #ccc;
        }

        .btn-back {
            background: #ffffff;
            color: var(--text-dark);
            border: 2px solid #ccc;
            margin-top: 20px;
            display: block;
            text-decoration: none;
            text-align: center;
        }
        .btn-back:hover { background: #f0f0f0; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="logo.jpg" alt="VC Kuppenheim Logo">
        </div>

        <h1>Rezept- & Materialplanung</h1>
        <p class="subtitle">Zutaten, Mengen & Equipment verwalten</p>

        <!-- Haupt-Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('getraenke')">🍹 Getränke</button>
            <button class="tab-btn" onclick="switchTab('verpflegung')">🍕 Verpflegung</button>
            <button class="tab-btn" onclick="switchTab('orga')">📦 Orga & Material</button>
        </div>

        <!-- REITER 1: GETRÄNKE -->
        <div id="tab-getraenke" class="tab-content active">
            <div class="add-form">
                <h3>Neues Getränk anlegen</h3>
                <div class="input-group">
                    <input type="text" id="newDrinkName" placeholder="z.B. Aperol Spritz" style="flex:2;">
                    <select id="newDrinkType" style="flex:1;">
                        <option value="alkoholisch">🍹 Alkoholisch</option>
                        <option value="alkoholfrei">🥤 Alkoholfrei</option>
                    </select>
                    <button class="btn btn-small" onclick="addItem('getraenke')">Anlegen</button>
                </div>
            </div>

            <!-- Unterteilung in Alkoholisch / Alkoholfrei -->
            <div class="sub-group-title">🍹 Alkoholische Getränke</div>
            <div id="list-getraenke-alkoholisch">Lade Daten...</div>

            <div class="sub-group-title">🥤 Alkoholfreie Getränke</div>
            <div id="list-getraenke-alkoholfrei">Lade Daten...</div>
        </div>

        <!-- REITER 2: VERPFLEGUNG -->
        <div id="tab-verpflegung" class="tab-content">
            <div class="add-form">
                <h3>Neues Gericht / Speise anlegen</h3>
                <div class="input-group">
                    <input type="text" id="newFoodName" placeholder="z.B. Wurst im Weck" style="flex:1;">
                    <button class="btn btn-small" onclick="addItem('verpflegung')">Anlegen</button>
                </div>
            </div>
            <div id="list-verpflegung">Lade Daten...</div>
        </div>

        <!-- REITER 3: ORGA / MATERIAL -->
        <div id="tab-orga" class="tab-content">
            <div class="add-form">
                <h3>Neuen Orga-Punkt anlegen</h3>
                <div class="input-group">
                    <input type="text" id="newOrgaName" placeholder="z.B. Kassenbereich / Bar-Equipment" style="flex:1;">
                    <button class="btn btn-small" onclick="addItem('orga')">Anlegen</button>
                </div>
            </div>
            <div id="list-orga">Lade Daten...</div>
        </div>

        <a href="admin.html" class="btn btn-back">← Zurück zum Admin-Bereich</a>
    </div>

    <!-- Firebase SKDs & JS-Logik -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, set, push, remove, update, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7UmrLGoePSvE1H0nZMUFjXY6HvWSynq4",
            authDomain: "vckuppenheim.firebaseapp.com",
            databaseURL: "https://vckuppenheim-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "vckuppenheim",
            storageBucket: "vckuppenheim.firebasestorage.app",
            messagingSenderId: "83870233719",
            appId: "1:83870233719:web:1ff3c18818c1dda1208272",
            measurementId: "G-CFWMCQSYVM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let dataStore = { getraenke: {}, verpflegung: {}, orga: {} };
        let openCards = new Set(); // Merkt sich offene Klappkarten beim Neuladen
        let editingIngredients = {}; // Speichert Status für Inline-Editing: { ingKey: true }

        // Live-Daten aus Firebase abrufen
        const stammdatenRef = ref(db, 'stammdaten');
        onValue(stammdatenRef, (snapshot) => {
            const data = snapshot.val() || {};
            dataStore = {
                getraenke: data.getraenke || {},
                verpflegung: data.verpflegung || {},
                orga: data.orga || {}
            };
            render();
        });

        // Tabs wechseln
        window.switchTab = function(cat) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`tab-${cat}`).classList.add('active');
        };

        // Akkordeon Umschalten
        window.toggleCard = function(key) {
            if (openCards.has(key)) {
                openCards.delete(key);
            } else {
                openCards.add(key);
            }
            render();
        };

        // Haupt-Eintrag anlegen
        window.addItem = function(category) {
            if (category === 'getraenke') {
                const name = document.getElementById('newDrinkName').value.trim();
                const drinkType = document.getElementById('newDrinkType').value;
                if (!name) return alert("Bitte Namen eingeben!");

                const newRef = push(ref(db, `stammdaten/getraenke`));
                set(newRef, { name: name, type: drinkType, ingredients: {}, equipment: {} });
                document.getElementById('newDrinkName').value = "";
            } else {
                const inputId = category === 'verpflegung' ? 'newFoodName' : 'newOrgaName';
                const name = document.getElementById(inputId).value.trim();
                if (!name) return alert("Bitte Namen eingeben!");

                const newRef = push(ref(db, `stammdaten/${category}`));
                set(newRef, { name: name, ingredients: {}, equipment: {} });
                document.getElementById(inputId).value = "";
            }
        };

        // Haupt-Eintrag löschen
        window.deleteItem = function(category, key) {
            if (confirm("Diesen Eintrag samt Zutaten wirklich löschen?")) {
                remove(ref(db, `stammdaten/${category}/${key}`));
            }
        };

        // Zutat hinzufügen
        window.addIngredient = function(category, itemKey) {
            const name = document.getElementById(`ing-name-${itemKey}`).value.trim();
            const amount = document.getElementById(`ing-amount-${itemKey}`).value.trim();
            const unit = document.getElementById(`ing-unit-${itemKey}`).value;

            if (!name) return alert("Bitte Zutatenname eingeben!");

            const newIngRef = push(ref(db, `stammdaten/${category}/${itemKey}/ingredients`));
            set(newIngRef, { name, amount: amount || "1", unit });

            document.getElementById(`ing-name-${itemKey}`).value = "";
            document.getElementById(`ing-amount-${itemKey}`).value = "";
        };

        // Inline-Editing aktivieren/deaktivieren
        window.toggleEditIngredient = function(ingKey) {
            editingIngredients[ingKey] = !editingIngredients[ingKey];
            render();
        };

        // Zutat speichern
        window.saveIngredient = function(category, itemKey, ingKey) {
            const name = document.getElementById(`edit-ing-name-${ingKey}`).value.trim();
            const amount = document.getElementById(`edit-ing-amount-${ingKey}`).value.trim();
            const unit = document.getElementById(`edit-ing-unit-${ingKey}`).value;

            if (!name) return alert("Name darf nicht leer sein!");

            update(ref(db, `stammdaten/${category}/${itemKey}/ingredients/${ingKey}`), {
                name, amount, unit
            });

            editingIngredients[ingKey] = false;
        };

        // Zutat löschen
        window.removeIngredient = function(category, itemKey, ingKey) {
            remove(ref(db, `stammdaten/${category}/${itemKey}/ingredients/${ingKey}`));
        };

        // Equipment hinzufügen / löschen
        window.addEquipment = function(category, itemKey) {
            const input = document.getElementById(`eq-input-${itemKey}`);
            const name = input.value.trim();
            if (!name) return;

            const newEqRef = push(ref(db, `stammdaten/${category}/${itemKey}/equipment`));
            set(newEqRef, { name });
            input.value = "";
        };

        window.removeEquipment = function(category, itemKey, eqKey) {
            remove(ref(db, `stammdaten/${category}/${itemKey}/equipment/${eqKey}`));
        };

        // HTML-Renderer für einzelne Karte
        function renderCardHTML(category, key, item) {
            const isOpen = openCards.has(key);
            const ingredientsObj = item.ingredients || {};
            const equipmentObj = item.equipment || {};
            const ingKeys = Object.keys(ingredientsObj);
            const eqKeys = Object.keys(equipmentObj);

            // Tabellenzeilen für Zutaten generieren
            let ingredientsRowsHtml = "";
            ingKeys.forEach(ingKey => {
                const ing = ingredientsObj[ingKey];
                const isEditing = editingIngredients[ingKey];

                if (isEditing) {
                    ingredientsRowsHtml += `
                        <tr>
                            <td colspan="3">
                                <div class="edit-row-inputs">
                                    <input type="text" id="edit-ing-name-${ingKey}" value="${ing.name}" style="flex:2;">
                                    <input type="number" id="edit-ing-amount-${ingKey}" value="${ing.amount}" style="width:65px;">
                                    <select id="edit-ing-unit-${ingKey}">
                                        ${['cl','dl','g','Zweige','Stück','Scheibe','Flasche','Dose','kg','l'].map(u => 
                                            `<option value="${u}" ${ing.unit === u ? 'selected' : ''}>${u}</option>`
                                        ).join('')}
                                    </select>
                                    <button class="btn btn-small" onclick="saveIngredient('${category}', '${key}', '${ingKey}')">💾</button>
                                </div>
                            </td>
                        </tr>
                    `;
                } else {
                    ingredientsRowsHtml += `
                        <tr>
                            <td><b>${ing.name}</b></td>
                            <td>${ing.amount} ${ing.unit}</td>
                            <td style="text-align:right;">
                                <button class="btn-icon" onclick="toggleEditIngredient('${ingKey}')" title="Bearbeiten">✏️</button>
                                <button class="btn-icon" onclick="removeIngredient('${category}', '${key}', '${ingKey}')" title="Löschen">❌</button>
                            </td>
                        </tr>
                    `;
                }
            });

            // Geräteleiste HTML
            let equipmentHtml = "";
            eqKeys.forEach(eqKey => {
                const eq = equipmentObj[eqKey];
                equipmentHtml += `
                    <li class="tag">
                        ${eq.name}
                        <span style="cursor:pointer; color:#888; font-weight:bold;" onclick="removeEquipment('${category}', '${key}', '${eqKey}')">&times;</span>
                    </li>
                `;
            });

            return `
                <div class="item-card ${isOpen ? 'open' : ''}">
                    <div class="item-header" onclick="toggleCard('${key}')">
                        <div class="title-area">
                            <span>${item.name}</span>
                            <span class="count-badge">${ingKeys.length} Zutaten</span>
                        </div>
                        <div>
                            <button class="btn-icon" onclick="event.stopPropagation(); deleteItem('${category}', '${key}')" title="Ganzes Rezept löschen">🗑️</button>
                            <span class="chevron">▼</span>
                        </div>
                    </div>
                    <div class="item-body">
                        <!-- Zutaten-Tabelle -->
                        <h5 style="font-size:0.8rem; text-transform:uppercase; color:#666; margin-bottom:6px;">Zutaten & Mengen</h5>
                        ${ingKeys.length > 0 ? `
                            <table class="ingredient-table">
                                <thead>
                                    <tr>
                                        <th>Zutat</th>
                                        <th>Menge</th>
                                        <th style="text-align:right;">Aktion</th>
                                    </tr>
                                </thead>
                                <tbody>${ingredientsRowsHtml}</tbody>
                            </table>
                        ` : '<p style="font-size:0.8rem; color:#999; margin-bottom:8px;">Noch keine Zutaten angelegt.</p>'}

                        <!-- Formular für neue Zutat -->
                        <div class="input-group" style="margin-bottom:14px;">
                            <input type="text" id="ing-name-${key}" placeholder="Zutat z.B. Gin" style="flex:2;">
                            <input type="number" id="ing-amount-${key}" placeholder="Menge" style="width:65px;">
                            <select id="ing-unit-${key}">
                                <option value="cl">cl</option>
                                <option value="dl">dl</option>
                                <option value="g">g</option>
                                <option value="Zweige">Zweige</option>
                                <option value="Stück">Stück</option>
                                <option value="Scheibe">Scheibe</option>
                                <option value="Flasche">Flasche</option>
                                <option value="Dose">Dose</option>
                                <option value="kg">kg</option>
                                <option value="l">l</option>
                            </select>
                            <button class="btn btn-small" onclick="addIngredient('${category}', '${key}')">+ Hinzufügen</button>
                        </div>

                        <!-- Geräte / Equipment -->
                        <h5 style="font-size:0.8rem; text-transform:uppercase; color:#666; margin-bottom:6px;">Geräte & Ausrüstung</h5>
                        <ul class="tag-list">${equipmentHtml}</ul>
                        <div class="input-group">
                            <input type="text" id="eq-input-${key}" placeholder="z.B. Gläser, Barlöffel, Eiswürfel" style="flex:1;">
                            <button class="btn btn-small" onclick="addEquipment('${category}', '${key}')">+</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Haupt-Render-Schleife
        function render() {
            // 1. Getränke Rendern (Getrennt nach Alkoholisch / Alkoholfrei)
            const alkContainer = document.getElementById('list-getraenke-alkoholisch');
            const freikContainer = document.getElementById('list-getraenke-alkoholfrei');
            alkContainer.innerHTML = "";
            freikContainer.innerHTML = "";

            const drinks = dataStore.getraenke;
            let alkCount = 0, freiCount = 0;

            Object.keys(drinks).forEach(key => {
                const item = drinks[key];
                const html = renderCardHTML('getraenke', key, item);
                if (item.type === 'alkoholfrei') {
                    freikContainer.innerHTML += html;
                    freiCount++;
                } else {
                    alkContainer.innerHTML += html;
                    alkCount++;
                }
            });

            if (alkCount === 0) alkContainer.innerHTML = "<p style='font-size:0.8rem; color:#999;'>Keine alkoholischen Getränke vorhanden.</p>";
            if (freiCount === 0) freikContainer.innerHTML = "<p style='font-size:0.8rem; color:#999;'>Keine alkoholfreien Getränke vorhanden.</p>";

            // 2. Verpflegung Rendern
            const foodContainer = document.getElementById('list-verpflegung');
            foodContainer.innerHTML = "";
            const foods = dataStore.verpflegung;
            const foodKeys = Object.keys(foods);
            if (foodKeys.length === 0) {
                foodContainer.innerHTML = "<p style='font-size:0.8rem; color:#999;'>Keine Speisen vorhanden.</p>";
            } else {
                foodKeys.forEach(key => {
                    foodContainer.innerHTML += renderCardHTML('verpflegung', key, foods[key]);
                });
            }

            // 3. Orga / Material Rendern
            const orgaContainer = document.getElementById('list-orga');
            orgaContainer.innerHTML = "";
            const orgas = dataStore.orga;
            const orgaKeys = Object.keys(orgas);
            if (orgaKeys.length === 0) {
                orgaContainer.innerHTML = "<p style='font-size:0.8rem; color:#999;'>Keine Orga-Punkte vorhanden.</p>";
            } else {
                orgaKeys.forEach(key => {
                    orgaContainer.innerHTML += renderCardHTML('orga', key, orgas[key]);
                });
            }
        }
    </script>
</body>
