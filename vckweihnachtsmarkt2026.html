<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCK Weihnachtsmarkt Umfrage 🎄</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --bg-header: #252525;
            --gold: #d4af37;
            --gold-hover: #f3e5ab;
            --red: #dc2626;
            --green: #16a34a;
            --text-light: #ffffff;
            --text-muted: #a3a3a3;
            --border: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); padding: 16px; color: var(--text-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        /* Standard / Mobilansicht */
        .card {
            background: var(--bg-card);
            width: 100%;
            max-width: 500px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border: 1px solid var(--gold);
            transition: all 0.3s ease;
        }

        /* Rot-Goldener Disclaimer Kasten */
        .disclaimer-box {
            background: rgba(220, 38, 38, 0.12);
            border: 1.5px solid var(--red);
            border-left: 6px solid var(--gold);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 20px;
            text-align: left;
        }

        .disclaimer-title {
            color: var(--gold);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .disclaimer-text {
            color: #fca5a5;
            font-size: 12px;
            line-height: 1.45;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: var(--gold); font-size: 20px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        .header p { color: var(--text-muted); font-size: 13px; line-height: 1.4; }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; color: var(--gold); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
        
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #2a2a2a;
            color: var(--text-light);
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--gold);
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
        }

        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .option-btn {
            background: #2a2a2a;
            border: 1px solid var(--border);
            color: var(--text-light);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-btn:hover { border-color: var(--gold); background: #333; }
        .option-btn.selected { border-color: var(--gold); background: rgba(212, 175, 55, 0.15); font-weight: bold; }

        .btn-submit {
            width: 100%;
            background: var(--gold);
            color: #000;
            border: none;
            padding: 12px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 13px;
        }

        .btn-submit:hover { background: var(--gold-hover); }

        /* Ergebnisse */
        .results-section { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 20px; }
        .results-title { font-size: 14px; color: var(--gold); margin-bottom: 12px; text-transform: uppercase; text-align: center; }

        .bar-container { margin-bottom: 12px; }
        .bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
        .bar-outer { background: #2a2a2a; height: 16px; border-radius: 8px; overflow: hidden; }
        .bar-inner-yes { background: var(--green); height: 100%; width: 0%; transition: width 0.4s; }
        .bar-inner-no { background: var(--red); height: 100%; width: 0%; transition: width 0.4s; }

        .voter-list { margin-top: 16px; background: #252525; padding: 12px; border-radius: 6px; max-height: 150px; overflow-y: auto; font-size: 11px; }
        .voter-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #333; }
        .voter-item:last-child { border-bottom: none; }
        .tag-yes { color: var(--green); font-weight: bold; }
        .tag-no { color: var(--red); font-weight: bold; }

        /* PC / Desktop Darstellung */
        @media (min-width: 768px) {
            .card { max-width: 700px; padding: 40px; border-radius: 16px; }
            .disclaimer-box { padding: 16px; margin-bottom: 24px; }
            .disclaimer-title { font-size: 14px; margin-bottom: 6px; }
            .disclaimer-text { font-size: 14px; }
            .header h1 { font-size: 28px; }
            .header p { font-size: 16px; }
            label { font-size: 14px; margin-bottom: 8px; }
            input[type="text"] { font-size: 16px; padding: 14px; }
            .option-btn { font-size: 16px; padding: 16px; }
            .btn-submit { font-size: 16px; padding: 16px; }
            .results-title { font-size: 18px; margin-bottom: 18px; }
            .bar-label { font-size: 15px; margin-bottom: 6px; }
            .bar-outer { height: 22px; border-radius: 11px; }
            .voter-list { font-size: 14px; max-height: 220px; padding: 16px; }
            .voter-item { padding: 8px 0; }
        }
    </style>
</head>
